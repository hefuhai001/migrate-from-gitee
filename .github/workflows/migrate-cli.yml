name: 批量迁移Gitee仓库到GitHub

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    
    steps:
      - name: 安装 Git（已预装，无需额外安装）
        run: |
          git --version
      
      - name: 配置 Git
        run: |
          git config --global user.name "hefuhai001"
          git config --global user.email "你的邮箱@example.com"
          # 配置 Git 凭证缓存，避免重复输入密码
          git config --global credential.helper cache
      
      - name: 批量迁移所有仓库
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          mkdir -p ~/migrate
          cd ~/migrate
          
          # 所有要迁移的仓库（去重后共28个）
          REPOS=(
            "books-zhiyue-platform"
            "note-of-vue3"
            "voice-accounting"
            "one-page"
            "code-run-platform"
            "valvular-disease-system"
            "blog-vitepress"
            "note-of-web"
            "note-of-vue2"
            "note-of-ai"
            "code-run-r"
            "note-of-django"
            "paper-generator-tool"
            "ai-multiple-model"
            "form-design"
            "bookmark-classfiy"
            "books-manage-system"
            "cultural-heritage-system"
            "hotel-manage-system"
            "chat-terminal-app"
            "community-elder-system"
            "geriatric-care-system"
            "culture-Inheritance-system"
            "music-player-system"
          )
          
          # 私有仓库列表
          PRIVATE_REPOS=(
            "voice-accounting"
            "one-page"
            "code-run-platform"
            "valvular-disease-system"
            "note-of-web"
            "code-run-r"
            "note-of-django"
            "paper-generator-tool"
            "ai-multiple-model"
            "cultural-heritage-system"
            "hotel-manage-system"
            "chat-terminal-app"
            "geriatric-care-system"
            "culture-Inheritance-system"
            "music-player-system"
          )
          
          TOTAL=${#REPOS[@]}
          CURRENT=0
          SUCCESS=0
          FAILED=0
          
          echo "========================================="
          echo "📊 总共需要迁移 $TOTAL 个仓库"
          echo "🔒 其中私有仓库: ${#PRIVATE_REPOS[@]} 个"
          echo "========================================="
          
          for REPO in "${REPOS[@]}"; do
            CURRENT=$((CURRENT + 1))
            echo ""
            echo "========================================="
            echo "🔄 [$CURRENT/$TOTAL] 正在处理: $REPO"
            echo "========================================="
            
            # 检查是否是私有仓库
            IS_PRIVATE="false"
            for PRIVATE_REPO in "${PRIVATE_REPOS[@]}"; do
              if [ "$REPO" == "$PRIVATE_REPO" ]; then
                IS_PRIVATE="true"
                break
              fi
            done
            
            # 1. 从 Gitee 克隆
            echo "📥 从 Gitee 克隆 $REPO ..."
            git clone --mirror https://$GITEE_USERNAME:$GITEE_TOKEN@gitee.com/$GITEE_USERNAME/$REPO.git
            
            if [ $? -ne 0 ]; then
              echo "❌ 克隆失败（仓库可能不存在），跳过 $REPO"
              FAILED=$((FAILED + 1))
              continue
            fi
            
            cd $REPO.git
            
            # 2. 构造 GitHub 推送 URL
            GITHUB_URL="https://hefuhai001:$GH_PAT@github.com/hefuhai001/$REPO.git"
            
            # 3. 先尝试创建空仓库（通过 API，使用 GH_PAT）
            echo "📝 在 GitHub 创建仓库: $REPO"
            if [ "$IS_PRIVATE" == "true" ]; then
              curl -X POST -H "Authorization: token $GH_PAT" \
                -H "Accept: application/vnd.github.v3+json" \
                https://api.github.com/user/repos \
                -d "{\"name\":\"$REPO\",\"private\":true}" 2>/dev/null || echo "⚠️ 仓库可能已存在"
            else
              curl -X POST -H "Authorization: token $GH_PAT" \
                -H "Accept: application/vnd.github.v3+json" \
                https://api.github.com/user/repos \
                -d "{\"name\":\"$REPO\",\"private\":false}" 2>/dev/null || echo "⚠️ 仓库可能已存在"
            fi
            
            # 4. 推送到 GitHub
            echo "📤 推送到 GitHub ..."
            git push --mirror $GITHUB_URL
            
            if [ $? -eq 0 ]; then
              echo "✅ $REPO 迁移成功！"
              SUCCESS=$((SUCCESS + 1))
            else
              echo "❌ $REPO 推送失败"
              FAILED=$((FAILED + 1))
            fi
            
            cd ..
            rm -rf $REPO.git
          done
          
          echo ""
          echo "========================================="
          echo "🎉 迁移完成！"
          echo "========================================="
          echo "📊 总计: $TOTAL | ✅ 成功: $SUCCESS | ❌ 失败: $FAILED"
          echo "========================================="
          
          if [ $FAILED -gt 0 ]; then
            exit 1
          fi
