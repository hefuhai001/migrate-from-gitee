name: 批量迁移Gitee仓库到GitHub

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    
    # 🔧 授予写入权限
    permissions:
      contents: write
    
    steps:
      - name: 安装 GitHub CLI
        run: |
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install gh -y
      
      - name: 配置 Git
        run: |
          git config --global user.name "hefuhai001"
          git config --global user.email "你的邮箱@example.com"
      
      - name: 批量迁移所有仓库
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/migrate
          cd ~/migrate
          
          REPOS=(
            "saas-admin"
            "single-admin"
            "medicine-system"
            "note-of-spring"
            "books-zhiyue-platform"
            "note-of-vue3"
            "voice-accounting"
            "one-page"
            "code-run-platform"
            "valvular-disease-system"
            "blog-vitepress"
            "note-of-web"
            "note-of-vue2"
            "note-of-ai"
            "code-run-r"
            "note-of-django"
            "paper-generator-tool"
            "ai-multiple-model"
            "form-design"
            "bookmark-classfiy"
            "books-manage-system"
            "cultural-heritage-system"
            "hotel-manage-system"
            "chat-terminal-app"
            "community-elder-system"
            "geriatric-care-system"
            "culture-Inheritance-system"
            "music-player-system"
          )
          
          PRIVATE_REPOS=(
            "voice-accounting"
            "one-page"
            "code-run-platform"
            "valvular-disease-system"
            "note-of-web"
            "note-of-ai"
            "code-run-r"
            "note-of-django"
            "paper-generator-tool"
            "ai-multiple-model"
            "cultural-heritage-system"
            "hotel-manage-system"
            "chat-terminal-app"
            "geriatric-care-system"
            "culture-Inheritance-system"
            "music-player-system"
          )
          
          TOTAL=${#REPOS[@]}
          CURRENT=0
          SUCCESS=0
          FAILED=0
          
          echo "========================================="
          echo "📊 总共需要迁移 $TOTAL 个仓库"
          echo "🔒 其中私有仓库: ${#PRIVATE_REPOS[@]} 个"
          echo "========================================="
          
          for REPO in "${REPOS[@]}"; do
            CURRENT=$((CURRENT + 1))
            echo ""
            echo "========================================="
            echo "🔄 [$CURRENT/$TOTAL] 正在处理: $REPO"
            echo "========================================="
            
            IS_PRIVATE="false"
            for PRIVATE_REPO in "${PRIVATE_REPOS[@]}"; do
              if [ "$REPO" == "$PRIVATE_REPO" ]; then
                IS_PRIVATE="true"
                break
              fi
            done
            
            echo "📥 从 Gitee 克隆 $REPO ..."
            git clone --mirror https://$GITEE_USERNAME:$GITEE_TOKEN@gitee.com/$GITEE_USERNAME/$REPO.git
            
            if [ $? -ne 0 ]; then
              echo "❌ 克隆失败，跳过 $REPO"
              FAILED=$((FAILED + 1))
              continue
            fi
            
            cd $REPO.git
            
            if [ "$IS_PRIVATE" == "true" ]; then
              echo "🔒 创建私有仓库: $REPO"
              gh repo create $REPO --private --confirm 2>/dev/null || true
            else
              echo "🌐 创建公开仓库: $REPO"
              gh repo create $REPO --public --confirm 2>/dev/null || true
            fi
            
            echo "📤 推送到 GitHub ..."
            git push --mirror https://hefuhai001:$GITHUB_TOKEN@github.com/hefuhai001/$REPO.git
            
            if [ $? -eq 0 ]; then
              echo "✅ $REPO 迁移成功！"
              SUCCESS=$((SUCCESS + 1))
            else
              echo "❌ $REPO 推送失败"
              FAILED=$((FAILED + 1))
            fi
            
            cd ..
            rm -rf $REPO.git
          done
          
          echo ""
          echo "========================================="
          echo "🎉 迁移完成！"
          echo "========================================="
          echo "📊 总计: $TOTAL | ✅ 成功: $SUCCESS | ❌ 失败: $FAILED"
          echo "========================================="
          
          if [ $FAILED -gt 0 ]; then
            exit 1
          fi
