name: 批量迁移 Gitee 仓库到 GitHub

on:
  workflow_dispatch:  # 允许你手动触发

jobs:
  migrate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo: 
          - saas-admin
          - single-admin
          - medicine-system
          - note-of-spring
          - books-zhiyue-platform
          - note-of-vue3
          - voice-accounting
          - one-page
          - code-run-platform
          - valvular-disease-system
          - blog-vitepress
          - note-of-web
          - note-of-vue2
          - note-of-ai
          - code-run-r
          - note-of-django
          - paper-generator-tool
          - ai-multiple-model
          - form-design
          - books-zhiyue-platform
          - bookmark-classfiy
          - books-manage-system
          - cultural-heritage-system
          - hotel-manage-system
          - chat-terminal-app
          - community-elder-system
          - geriatric-care-system
          - culture-Inheritance-system
          - music-player-system
    steps:
      - name: 执行镜像迁移
        uses: Yikun/hub-mirror-action@v1.2
        with:
          src: 'gitee/${{ secrets.GITEE_USERNAME }}'
          dst: 'github/${{ github.repository_owner }}'
          dst_key: ${{ secrets.GITHUB_TOKEN }}
          dst_token: ${{ secrets.GITHUB_TOKEN }}
          src_token: ${{ secrets.GITEE_TOKEN }}
          # 静态列表模式，指定要迁移的仓库
          static_list: ${{ matrix.repo }}
          # 强制更新，覆盖GitHub上可能已存在的内容
          force_update: true
